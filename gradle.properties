# ===== ctool4j 构建配置 =====
#
# JDK 档位：决定启用哪一侧容器（jdk8 → javax，其他 → jakarta）与依赖版本档位。
# 取值：系统属性（-DJDK_VERSION=25）与环境变量（JDK_VERSION=25）同优先级（前者为空时取后者），
# 两者都为空才读本文件，最后缺省 8。
# 刻意不读 JVM 的 java.version 系统属性——它恒等于构建机 JDK，会使"默认 jdk8"失效。
#JDK_VERSION=8

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
